<!DOCTYPE html>
<html lang="de"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Wagenrennen im Circus Maximus</title></head>
<body><script src="kit.js"></script>
<script>
(async () => {
const {W, H, ctx} = K;
const IMG = await K.load({bg:'img/circus.jpg', wagen:'img/wagen.png', gruen:'img/wagen_gruen.png', blau:'img/wagen_blau.png', lila:'img/wagen_lila.png'});
const LANES = [
  {y: 462, name:'Marcus', img:'gruen', dx: -30},
  {y: 547, name:'Julia', img:'blau', dx: 20},
  {y: 632, name:'DU', img:'wagen', me:true, dx: 0},
  {y: 712, name:'Flavia', img:'lila', dx: -50}
];
let state = 'title', cars, q, qT, countdown, finishOrder, raceT, t0, bgOff, asked, right;

function newQ() {
  const pool = K.WORDS; const w = K.pick(pool);
  let other; do { other = K.pick(pool); } while (other === w);
  const opts = K.shuffle([w[1], w[2], other[1]]);
  q = {w, opts, ans:null, t:0};
  asked++;
}
function reset() {
  cars = LANES.map((l, i) => ({...l, p: 0, v: 0, boost: 0, stall: 0, rate: l.me ? 1/120 : [1/52, 1/58, 0, 1/64][i], fin: null, wob: Math.random()*6}));
  countdown = 3.99; finishOrder = []; raceT = 0; bgOff = 0; asked = 0; right = 0; q = null; K.clearFx();
}
reset();
K.music(...K.MEL.marsch, .14);

const BTN = [0,1,2].map(i => ({x: 90 + i*380, y: 190, w: 340, h: 100}));
function answer(i) {
  if (!q || q.ans !== null || state !== 'race') return;
  q.ans = i; q.t = 0;
  const me = cars[2];
  if (q.opts[i] === q.w[1]) { right++; me.boost += .055; K.sfx.right(); K.confetti(BTN[i].x + BTN[i].w/2, BTN[i].y + 50, 25); K.float(BTN[i].x + BTN[i].w/2, BTN[i].y - 10, K.pick(['Schneller!','Bene!','Optime!','Super!']), '#2ecc71', 40); }
  else { me.stall = 1.2; K.sfx.wrong(); K.float(me.x || 400, me.y - 140, 'Oh, das Pferd stolpert!', '#ff4d6d', 32); }
}
K.onTap = (x, y) => {
  if (state === 'title' || state === 'end') { if (state === 'end' && performance.now() - t0 < 1200) return; reset(); state = 'count'; K.musicOn = true; return; }
  BTN.forEach((b, i) => { if (K.hit(x, y, b)) answer(i); });
};
K.onKey = e => {
  if (state === 'title' || state === 'end') { if (e.code === 'Space' || e.code === 'Enter') K.onTap(0, 0); return; }
  const m = {Digit1:0, Digit2:1, Digit3:2, Numpad1:0, Numpad2:1, Numpad3:2, KeyA:0, KeyS:1, KeyD:2, ArrowLeft:0, ArrowDown:1, ArrowRight:2}[e.code];
  if (m !== undefined) answer(m);
};

function update(dt) {
  if (state === 'count') {
    const before = Math.ceil(countdown); countdown -= dt; const after = Math.ceil(countdown);
    if (after !== before) after > 0 ? K.sfx.tick() : K.sfx.horn();
    if (countdown <= 0) { state = 'race'; newQ(); }
    return;
  }
  if (state !== 'race') return;
  raceT += dt;
  for (const c of cars) {
    if (c.fin !== null) { c.p += .04 * dt; continue; }
    let v = c.rate;
    if (!c.me) v *= 1 + Math.sin(raceT * .7 + c.wob) * .25;
    if (c.stall > 0) { c.stall -= dt; v *= .15; }
    if (c.boost > 0) { const b = Math.min(c.boost, dt * .09); c.boost -= b; c.p += b; }
    c.p += v * dt;
    if (c.p >= 1) { c.fin = finishOrder.length; finishOrder.push(c); if (c.me) { K.sfx.win(); } }
  }
  if (cars[2].fin !== null) { state = 'end'; t0 = performance.now(); K.musicOn = false; for (let i = 0; i < 5; i++) setTimeout(() => K.confetti(200 + Math.random()*880, 250), i*200); }
  if (q && q.ans !== null) { q.t += dt; if (q.t > .7) newQ(); }
}

function drawBG() {
  const im = IMG.bg; if (!im) { ctx.fillStyle = '#8fd3ff'; ctx.fillRect(0,0,W,H); return; }
  const s = H / im.naturalHeight, w = im.naturalWidth * s;
  const off = -(cars[2].p * 5200) % (2*w);
  let x = ((off % (2*w)) + 2*w) % (2*w) - 2*w;
  for (let i = 0; x < W; x += w, i++) {
    ctx.save();
    if (i % 2) { ctx.translate(x + w, 0); ctx.scale(-1, 1); ctx.drawImage(im, 0, 0, w + 1, H); }
    else ctx.drawImage(im, x, 0, w + 1, H);
    ctx.restore();
  }
  // Bahnlinien
  ctx.strokeStyle = 'rgba(255,255,255,.35)'; ctx.lineWidth = 3; ctx.setLineDash([30, 22]);
  const dash = ((cars[2].p * 5200) % 52);
  ctx.lineDashOffset = dash;
  for (const y of [495, 580, 665]) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke(); }
  ctx.setLineDash([]);
}
const sx = c => 380 + c.dx + (c.p - cars[2].p) * 2600;
function drawCars(t) {
  // Ziellinie
  const fx = 380 + (1 - cars[2].p) * 2600 + 110;
  if (fx < W + 50) {
    for (let r = 0; r < 15; r++) for (let k = 0; k < 2; k++) { ctx.fillStyle = (r + k) % 2 ? '#fff' : '#222'; ctx.fillRect(fx + k*16, 430 + r*20, 16, 20); }
    K.text('FINIS', fx + 16, 405, 34, '#fff', {stroke:'#7d0f1c', sw:7});
  }
  for (const c of cars) {
    const x = sx(c); c.x = x; c.y = c.y;
    if (x < -200 || x > W + 200) {
      // Pfeil am Rand für Wagen außerhalb des Bildes
      const ex = x < 0 ? 40 : W - 40;
      K.text(x < 0 ? '◀ ' + c.name : c.name + ' ▶', ex + (x < 0 ? 50 : -50), c.y - 50, 22, '#fff', {stroke:'#000', sw:5});
      continue;
    }
    const moving = state === 'race' || state === 'end';
    const bob = moving ? Math.sin(t * 22 + c.wob) * 3 : 0;
    ctx.fillStyle = 'rgba(0,0,0,.2)'; ctx.beginPath(); ctx.ellipse(x, c.y + 2, 120, 12, 0, 0, Math.PI*2); ctx.fill();
    K.drawH(IMG[c.img], x, c.y + bob, 105);
    if (moving && Math.random() < .5) K.puff(x - 100, c.y - 5, 'rgba(210,180,130,.8)', 1, 80);
    if (c.me) {
      const ay = c.y - 150 + Math.sin(t*6)*6;
      K.text('▼ DU', x + 10, ay + 25, 28, '#ffd23f', {stroke:'#7d0f1c', sw:7});
    } else K.text(c.name, x + 40, c.y - 112, 20, '#fff', {stroke:'rgba(0,0,0,.6)', sw:5});
    if (c.boost > .005) K.text('💨', x - 140, c.y - 60, 40, '#fff');
  }
}
function drawHUD() {
  // Fortschritt
  K.rr(75, 22, 400, 28, 14); ctx.fillStyle = 'rgba(0,0,0,.4)'; ctx.fill();
  for (const c of cars) {
    const x = 89 + Math.min(1, c.p) * 372;
    ctx.beginPath(); ctx.arc(x, 36, c.me ? 13 : 9, 0, Math.PI*2);
    ctx.fillStyle = c.me ? '#ffd23f' : ['#7ae582','#3ec1d3','','#b388ff'][cars.indexOf(c)]; ctx.fill(); ctx.lineWidth = 3; ctx.strokeStyle = '#fff'; ctx.stroke();
  }
  K.text('🏁', 490, 36, 26, '#fff');
  K.pill(W - 330, 14, 190, '✔ ' + right + ' richtig', '#7ae582');
  if (state === 'race' && q) {
    // Frage
    const bw = 560;
    K.rr(W/2 - bw/2, 72, bw, 96, 30); const g = ctx.createLinearGradient(0,72,0,168); g.addColorStop(0,'#b3202f'); g.addColorStop(1,'#7d0f1c');
    ctx.fillStyle = g; ctx.fill(); ctx.lineWidth = 6; ctx.strokeStyle = '#ffd23f'; ctx.stroke();
    K.text('Was heißt …', W/2, 94, 20, '#ffe9a8', {weight:500});
    K.text(q.w[0] + ' ?', W/2, 132, 50, '#fff', {stroke:'#4a0710', sw:7});
    BTN.forEach((b, i) => {
      let st = null;
      if (q.ans !== null) st = q.opts[i] === q.w[1] ? 'ok' : (i === q.ans ? 'bad' : 'dim');
      K.button(b, q.opts[i], st);
      ctx.beginPath(); ctx.arc(b.x + 22, b.y + 22, 16, 0, Math.PI*2); ctx.fillStyle = '#7d0f1c'; ctx.fill();
      K.text(String(i+1), b.x + 22, b.y + 23, 20, '#fff');
    });
  }
}
const RN = ['', 'I', 'II', 'III'];
function draw(dt, t) {
  drawBG(); drawCars(t); K.drawFx(dt); drawHUD();
  if (state === 'count') {
    const n = Math.ceil(countdown), f = countdown - Math.floor(countdown);
    K.text(n > 0 ? RN[n] : 'LOS!', W/2, 260, 160 + f*60, '#ffd23f', {stroke:'#7d0f1c', sw:24});
    K.text('Tippe schnell auf die richtige Übersetzung – dann rast dein Wagen los!', W/2, 380, 28, '#fff', {stroke:'#000', sw:6});
  }
  if (state === 'title') {
    K.panel(860, 520);
    K.title('WAGENRENNEN', 170, 82);
    K.text('im Circus Maximus', W/2, 238, 34, '#3b2a1a', {weight:500});
    K.drawH(IMG.wagen, W/2, 440, 170);
    K.text('Jede richtige Antwort = Turbo für deinen Wagen!', W/2, 475, 28, '#3b2a1a');
    K.text('Schaffst du Platz I ?', W/2, 515, 26, '#6b4f2a', {weight:500});
    K.blink('Tippen oder Leertaste zum Starten!', 570);
  }
  if (state === 'end') {
    K.panel(860, 560);
    const place = cars[2].fin + 1;
    K.title(place === 1 ? 'SIEG!' : 'IM ZIEL!', 150, 86, place === 1 ? '#ffd23f' : '#fff', place === 1 ? '#1e7a45' : '#3b5998');
    K.text(place === 1 ? 'Du bist der Champion des Circus Maximus!' : 'Du bist auf Platz ' + RN[place] + ' (' + place + ') gelandet!', W/2, 222, 32, '#3b2a1a');
    // Siegertreppchen
    const pod = [{x: W/2, h: 120}, {x: W/2 - 200, h: 85}, {x: W/2 + 200, h: 60}];
    const ranking = cars.slice().sort((a, b) => (a.fin ?? 99) - (b.fin ?? 99) || b.p - a.p);
    ranking.slice(0, 3).forEach((c, i) => {
      const p = pod[i];
      ctx.fillStyle = ['#ffd23f','#d9d9d9','#e3a35f'][i]; K.rr(p.x - 85, 520 - p.h, 170, p.h, 10); ctx.fill();
      K.text(RN[i+1], p.x, 520 - p.h/2, 40, '#3b2a1a');
      K.drawH(IMG[c.img], p.x, 515 - p.h, 80);
      K.text(c.me ? 'DU' : c.name, p.x, 530 - p.h - 95, 24, c.me ? '#b3202f' : '#3b2a1a');
    });
    K.text(right + ' von ' + (asked) + ' Wörtern richtig', W/2, 560, 26, '#3b2a1a', {weight:500});
    if (performance.now() - t0 > 1200) K.blink('Nochmal fahren? Tippen!', 605);
  }
  if (state === 'race' && !K.focused()) K.text('Tippe die Antworten an oder drücke 1 · 2 · 3', W/2, 330, 24, '#fff', {stroke:'#000', sw:5});
}
K.loop((dt, t) => { update(dt); draw(dt, t); });
window.__game = {get state(){return state}, get q(){return q}, answer, get cars(){return cars}};
})();
</script></body></html>
