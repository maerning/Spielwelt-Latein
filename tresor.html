<!DOCTYPE html>
<html lang="de"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Der Tresor des Kaisers</title></head>
<body><script src="kit.js"></script>
<script>
(async () => {
const {W, H, ctx} = K;
const IMG = await K.load({bg:'img/schatzkammer.jpg', zu:'img/truhe_zu.png', auf:'img/truhe_auf.png'});
const ROM = ['', 'I','II','III','IV','V','VI','VII','VIII','IX'];
const VAL = {I:1, V:5, X:10};
const OBJ = [
  {art:'die Münze', lbl:'Auf der Münze steht:'},
  {art:'die Säule', lbl:'In die Säule ist gemeißelt:'},
  {art:'die Schriftrolle', lbl:'Auf der Schriftrolle steht:'},
  {art:'die Wachstafel', lbl:'Auf der Wachstafel steht:'}
];
let state = 'title', code, stage, picked, fb, t0, startT, opened, wrongs;
const PAD = []; for (let i = 0; i < 9; i++) PAD.push({x: 470 + (i % 3) * 112, y: 390 + Math.floor(i / 3) * 92, w: 100, h: 80, n: i + 1});

function newCode() {
  // erst leicht, dann schwerer
  const easy = [1,2,3,5,6,7,8], hard = [4,9,6,7,8];
  code = [K.pick([1,2,3]), K.pick([5,6,7,8]), K.pick(easy.concat([4])), K.pick(hard)];
  stage = 0; picked = null; fb = null; wrongs = 0; opened = 0; K.clearFx();
}
function explain(n) {
  const r = ROM[n];
  if (r === 'IV') return 'IV: I steht vor V → 5 − 1 = 4';
  if (r === 'IX') return 'IX: I steht vor X → 10 − 1 = 9';
  return r + ' = ' + r.split('').map(c => VAL[c]).join(' + ') + ' = ' + n;
}
function choose(n) {
  if (state !== 'play' || fb) return;
  const ok = n === code[stage];
  K.sfx.click();
  if (ok) {
    fb = {ok: true, t: 0, txt: explain(n)}; K.sfx.right(); K.confetti(620, 250, 30);
  } else {
    wrongs++; fb = {ok: false, t: 0, txt: 'Nicht ganz! ' + explain(code[stage]) + ' – tippe die ' + code[stage] + '.', n}; K.sfx.wrong();
  }
}
K.onTap = (x, y) => {
  if (state === 'title') { start(); return; }
  if (state === 'win') { if (performance.now() - t0 > 1500) start(); return; }
  if (fb && !fb.ok && fb.t > .4) { fb = null; return; }
  PAD.forEach(b => { if (K.hit(x, y, b)) choose(b.n); });
};
K.onKey = e => {
  if (state !== 'play') { if (['Space','Enter'].includes(e.code)) K.onTap(0, 0); return; }
  const m = e.code.match(/^(Digit|Numpad)([1-9])$/); if (m) { if (fb && !fb.ok) fb = null; choose(+m[2]); }
};
function start() { newCode(); state = 'play'; startT = performance.now(); K.musicOn = true; K.music(...K.MEL.geheim, .2); }

function update(dt) {
  if (fb) { fb.t += dt; if (fb.ok && fb.t > 1.3) { fb = null; stage++; K.sfx.coin(); if (stage === 4) { state = 'opening'; t0 = performance.now(); K.musicOn = false; K.sfx.unlock(); } } }
  if (state === 'opening' && performance.now() - t0 > 900) { state = 'win'; opened = 1; K.coins(1075, 520, 50); K.sfx.win(); for (let i = 0; i < 4; i++) setTimeout(() => K.coins(1075, 520, 25), 400 + i*350); }
}
function drawClue(t) {
  const n = code[stage], r = ROM[n], o = OBJ[stage], cx = 620, cy = 225;
  K.text('Hinweis ' + (stage + 1) + ' von 4', cx, 55, 28, '#fff', {stroke:'#3b2a1a', sw:6});
  K.text(o.lbl, cx, 95, 26, '#ffe9a8', {stroke:'#3b2a1a', sw:6});
  ctx.save(); ctx.translate(cx, cy + Math.sin(t*2)*4);
  if (stage === 0) { // Münze
    ctx.beginPath(); ctx.arc(0, 0, 95, 0, Math.PI*2); ctx.fillStyle = '#f5b700'; ctx.fill(); ctx.lineWidth = 10; ctx.strokeStyle = '#b37800'; ctx.stroke();
    ctx.beginPath(); ctx.arc(0, 0, 75, 0, Math.PI*2); ctx.lineWidth = 3; ctx.strokeStyle = '#d99a00'; ctx.stroke();
    K.text(r, 0, 4, K.fit(r, 130, 70), '#7a4b00');
  } else if (stage === 1) { // Säule
    const g = ctx.createLinearGradient(-60,0,60,0); g.addColorStop(0,'#d9d2c3'); g.addColorStop(.5,'#fff'); g.addColorStop(1,'#bfb6a4');
    ctx.fillStyle = g; ctx.fillRect(-55, -95, 110, 200); ctx.fillStyle = '#e9e2d2'; K.rr(-80, -118, 160, 28, 8); ctx.fill(); K.rr(-80, 100, 160, 24, 6); ctx.fill();
    ctx.fillStyle = '#f4efe4'; K.rr(-48, -38, 96, 76, 8); ctx.fill(); ctx.strokeStyle = '#a89c84'; ctx.lineWidth = 3; ctx.stroke();
    K.text(r, 0, 2, K.fit(r, 88, 56), '#5b4a33');
  } else if (stage === 2) { // Schriftrolle
    ctx.fillStyle = '#f3e1b0'; ctx.fillRect(-120, -70, 240, 140); ctx.strokeStyle = '#b8935a'; ctx.lineWidth = 4; ctx.strokeRect(-120, -70, 240, 140);
    for (const sx of [-130, 130]) { ctx.fillStyle = '#c99a5b'; K.rr(sx - 14, -85, 28, 170, 14); ctx.fill(); }
    K.text(r, 0, 4, K.fit(r, 200, 72), '#5b3a17');
  } else { // Wachstafel
    ctx.fillStyle = '#8b5a2b'; K.rr(-125, -85, 250, 170, 12); ctx.fill(); ctx.fillStyle = '#3f2a16'; K.rr(-105, -65, 210, 130, 8); ctx.fill();
    K.text(r, 0, 4, K.fit(r, 180, 72), '#f1d9a6');
  }
  ctx.restore();
  K.text('Welche Zahl ist das? Tippe sie an!', cx, 355, 26, '#fff', {stroke:'#3b2a1a', sw:6});
}
function drawHelp() {
  K.rr(25, 120, 395, 420, 26); ctx.fillStyle = 'rgba(255,250,240,.95)'; ctx.fill(); ctx.lineWidth = 6; ctx.strokeStyle = '#d4a017'; ctx.stroke();
  K.text('📜 Spickzettel', 222, 160, 32, '#7d0f1c');
  const rows = [['I', '= 1'], ['V', '= 5'], ['X', '= 10']];
  rows.forEach((r, i) => { K.text(r[0], 150, 220 + i*58, 50, '#3b2a1a'); K.text(r[1], 255, 220 + i*58, 44, '#3b2a1a', {weight:500}); });
  K.text('Zusammenzählen:', 222, 400, 22, '#6b4f2a'); K.text('VI = 5 + 1 = 6', 222, 430, 26, '#3b2a1a', {weight:500});
  K.text('Kleines VOR Großem:', 222, 472, 22, '#6b4f2a'); K.text('IV = 5 − 1 = 4', 222, 502, 26, '#3b2a1a', {weight:500});
}
function drawLock(t) {
  // Code-Felder
  const x0 = 1075 - 2*68 + 4;
  K.rr(x0 - 22, 140, 4*68 + 30, 100, 20); ctx.fillStyle = 'rgba(40,25,10,.8)'; ctx.fill(); ctx.lineWidth = 5; ctx.strokeStyle = '#d4a017'; ctx.stroke();
  for (let i = 0; i < 4; i++) {
    const x = x0 + i*68, filled = i < stage || (fb && fb.ok && i === stage && fb.t > .8);
    K.rr(x - 10, 155, 56, 70, 10); ctx.fillStyle = filled ? '#ffd23f' : '#5a4630'; ctx.fill();
    K.text(filled ? String(code[i]) : '?', x + 18, 192, 44, filled ? '#7a4b00' : '#a89272');
  }
  K.text('🔒 Zahlenschloss', 1075, 115, 26, '#fff', {stroke:'#3b2a1a', sw:6});
  const im = opened ? IMG.auf : IMG.zu;
  const shake = state === 'opening' ? Math.sin(t*50) * 8 : 0;
  ctx.save(); ctx.translate(shake, 0); K.drawH(im, 1075, 690, 250); ctx.restore();
}
function draw(dt, t) {
  K.drawCover(IMG.bg); ctx.fillStyle = 'rgba(20,10,0,.25)'; ctx.fillRect(0, 0, W, H);
  if (state === 'title') {
    K.drawH(IMG.zu, W/2 + 330, 640, 260);
    K.panel(800, 480, 360, false);
    K.title('DER TRESOR DES KAISERS', 190, 56);
    K.text('Kaiser Augustus hat seinen Schatz in einer Truhe versteckt.', W/2, 260, 26, '#3b2a1a');
    K.text('Das Schloss hat 4 Ziffern – geschrieben in römischen Zahlen!', W/2, 300, 26, '#3b2a1a');
    K.text('Finde die Hinweise und knacke den Code.', W/2, 345, 26, '#6b4f2a', {weight:500});
    K.text('I = 1   •   V = 5   •   X = 10', W/2, 405, 40, '#7d0f1c');
    K.blink('Tippen zum Starten!', 525);
    K.drawFx(dt); return;
  }
  drawHelp(); drawLock(t);
  if (state === 'play') {
    drawClue(t);
    PAD.forEach(b => {
      let st = null; if (fb && fb.ok && b.n === code[stage]) st = 'ok'; if (fb && !fb.ok && b.n === fb.n) st = 'bad';
      K.button(b, String(b.n), st, {size: 46, colors:['#fff4d6','#f0cf7a'], border:'#8b5a2b'});
    });
    if (fb) {
      K.rr(440, 655, 1, 1, 1);
      K.text(fb.ok ? '✔ Richtig! ' + fb.txt : fb.txt, 640, 690, K.fit(fb.ok ? '✔ Richtig! ' + fb.txt : fb.txt, 1180, 30), fb.ok ? '#7ae582' : '#ffb3bd', {stroke:'#000', sw:6});
    }
  }
  K.drawFx(dt);
  if (state === 'win') {
    const sec = Math.round((t0 - startT) / 1000);
    K.rr(170, 150, 640, 300, 30); ctx.fillStyle = 'rgba(255,250,240,.96)'; ctx.fill(); ctx.lineWidth = 8; ctx.strokeStyle = '#d4a017'; ctx.stroke();
    K.text('GEKNACKT!', 490, 215, 70, '#ffd23f', {stroke:'#7a4b00', sw:12});
    K.text('Du hast den Schatz des Kaisers gefunden!', 490, 285, 28, '#3b2a1a');
    K.text('Code: ' + code.map(n => ROM[n]).join(' · ') + '  =  ' + code.join(''), 490, 335, 28, '#6b4f2a', {weight:500});
    K.text(wrongs === 0 ? 'Ohne einen einzigen Fehler – optime! 🏆' : 'Fehlversuche: ' + wrongs, 490, 380, 24, '#6b4f2a', {weight:500});
    if (performance.now() - t0 > 1500) { if (Math.floor(performance.now()/500)%2===0) K.text('Tippen: neuer Tresor!', 490, 425, 26, '#b3202f'); }
  }
}
K.loop((dt, t) => { update(dt); draw(dt, t); });
window.__game = {get state(){return state}, get code(){return code}, get stage(){return stage}, choose, start};
})();
</script></body></html>
